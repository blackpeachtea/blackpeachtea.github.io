<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>운동챌린지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF8;
    --surface:#FFFFFF;
    --surface-muted:#F2F1EC;
    --ink:#1C1C1A;
    --ink-secondary:#6B6A64;
    --ink-muted:#A6A59D;
    --border:#E5E3DA;
    --border-strong:#CFCDC2;
    --mono:'IBM Plex Mono', monospace;
    --sans:'Pretendard', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    padding:40px 18px 90px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:600px;margin:0 auto;}

  .eyebrow{
    font-size:12px; letter-spacing:0.06em; color:var(--ink-muted);
    margin:0 0 8px; font-weight:500;
  }
  .date-row{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:32px; }
  .date-row .date{ font-family:var(--mono); font-size:22px; font-weight:600; letter-spacing:-0.01em; }
  .date-row .streak{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-secondary); }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px 20px;
    margin-bottom:20px;
  }

  h2{ font-size:14px; font-weight:600; margin:0 0 14px; color:var(--ink); }

  input[type=text]{
    width:100%; padding:11px 13px; border-radius:8px;
    border:1px solid var(--border-strong); font-size:14px; font-family:inherit;
    background:var(--bg); color:var(--ink);
  }
  input[type=text]:focus{ outline:none; border-color:var(--ink-muted); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    padding:11px 18px; border-radius:8px; border:1px solid var(--border-strong);
    background:var(--surface); color:var(--ink); font-weight:600; font-size:14px;
    cursor:pointer; width:100%; margin-top:10px; font-family:inherit;
  }
  .btn:hover{ background:var(--surface-muted); }
  .btn:disabled{ color:var(--ink-muted); cursor:default; }
  .btn.primary{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .btn.primary:hover{ background:#333331; }
  .btn.text{ border:none; background:none; width:auto; padding:6px 0; color:var(--ink-secondary); font-weight:500; text-decoration:underline; margin-top:0; }

  .name-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:2px; }
  .name-chip{
    padding:8px 14px; border-radius:8px; border:1px solid var(--border-strong);
    background:var(--surface); font-size:13px; cursor:pointer; font-weight:500;
  }
  .name-chip:hover{ border-color:var(--ink); }

  .checkrow{ display:flex; align-items:center; justify-content:space-between; }
  .checkrow .who .name{ font-weight:600; font-size:15px; margin-bottom:2px; }
  .checkrow .who .sub{ font-size:12px; color:var(--ink-secondary); }
  .checkrow .btn{ width:auto; margin-top:0; padding:10px 16px; }

  .switch-name{ text-align:center; margin-top:14px; }
  .switch-name a{ color:var(--ink-muted); font-size:12px; cursor:pointer; text-decoration:underline; }
  .name-list + .switch-name{ margin-top:20px; padding-top:16px; border-top:1px solid var(--border); }

  .status-msg{ text-align:center; font-size:12px; color:var(--ink-muted); min-height:16px; margin-top:8px; }
  .hidden{ display:none !important; }

  .ledger{ border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--surface); }
  .scroll-x{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:12px; }
  th,td{ padding:9px 5px; text-align:center; white-space:nowrap; }
  thead th{
    color:var(--ink-muted); font-weight:500; font-family:var(--mono); font-size:11px;
    border-bottom:1px solid var(--border);
  }
  thead th.weekend{ color:var(--ink-muted); }
  thead th.today{ background:var(--surface-muted); color:var(--ink); font-weight:600; }
  td.name-cell, th.name-cell{ text-align:left; padding-left:14px; font-weight:500; color:var(--ink); }
  th.name-cell{ color:var(--ink-muted); font-family:var(--sans); }
  td.today-col{ background:var(--surface-muted); }
  td.count-cell{ text-align:right; padding-right:14px; font-family:var(--mono); color:var(--ink-secondary); font-size:11px; }
  tbody tr:not(:last-child) td{ border-bottom:1px solid var(--border); }

  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; }
  .dot-weekday{ background:var(--ink); }
  .dot-weekend{ background:var(--ink-muted); }
  .dot-empty{ border:1px solid var(--border-strong); }

  .legend{ display:flex; gap:16px; margin-top:12px; font-size:11px; color:var(--ink-muted); }
  .legend div{ display:flex; align-items:center; gap:5px; }

  .badge-icon{ font-size:11px; color:var(--ink-muted); margin-left:4px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">운동챌린지</p>

  <!-- 이름 게이트 -->
  <div id="gate">
    <div class="card">
      <h2>참여자 선택</h2>
      <div id="gateLoading" class="status-msg">불러오는 중</div>
      <div id="nameListWrap" class="hidden">
        <div id="nameList" class="name-list"></div>
        <div class="switch-name"><a id="showRegister">이번 달 처음이에요, 등록할게요</a></div>
      </div>
      <div id="registerBox" class="hidden">
        <input type="text" id="regName" placeholder="이름을 입력하세요">
        <button class="btn primary" id="registerBtn">등록하고 시작하기</button>
        <div class="switch-name"><a id="showList">참여자 목록으로 돌아가기</a></div>
      </div>
      <div class="status-msg" id="gateMsg"></div>
    </div>
  </div>

  <!-- 메인 화면 -->
  <div class="hidden" id="main">
    <div class="date-row">
      <div class="date" id="todayDate"></div>
      <div class="streak" id="streakLabel"></div>
    </div>

    <div class="card">
      <div class="checkrow">
        <div class="who">
          <div class="name" id="helloName"></div>
          <div class="sub">오늘 출석을 기록해요</div>
        </div>
        <button class="btn" id="checkBtn">체크</button>
      </div>
      <div class="status-msg" id="checkMsg"></div>
    </div>

    <div class="switch-name" style="margin-bottom:20px;"><a id="switchUser">다른 사람으로 전환</a></div>
  </div>

  <!-- 전체 현황 -->
  <div class="hidden" id="board">
    <h2 id="boardTitle" style="margin-bottom:10px;">이번 달 현황</h2>
    <div class="ledger scroll-x">
      <table id="boardTable"></table>
    </div>
    <div class="legend">
      <div><span class="dot dot-weekday"></span>평일 출석</div>
      <div><span class="dot dot-weekend"></span>주말 출석</div>
      <div><span class="dot dot-empty"></span>미체크</div>
    </div>
  </div>
</div>

<script>
(function(){
  // 배포한 Apps Script 웹 앱 URL을 여기에 붙여넣으세요
  const API_URL = 'https://script.google.com/macros/s/AKfycbwnpnJ8lTNAFM4tVA7aCoOcwE6ZC-aF54cs9qn2WN-GqKS1X4TnffMeukp1bTSJHixCgQ/exec';

  let state = null;
  let currentName = localStorage.getItem('exch_name') || null;

  function el(id){ return document.getElementById(id); }

  async function api(action, params){
    const qs = new URLSearchParams(Object.assign({action}, params||{}));
    const res = await fetch(API_URL + '?' + qs.toString());
    return res.json();
  }

  function fmtDateKo(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    const days = ['일','월','화','수','목','금','토'];
    return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
  }

  async function loadAll(){
    state = await api('getData');
  }

  function renderGate(){
    el('gateLoading').classList.add('hidden');
    if (state.names.length === 0){
      el('nameListWrap').classList.add('hidden');
      showRegisterBox();
      return;
    }
    el('nameListWrap').classList.remove('hidden');
    const listEl = el('nameList');
    listEl.innerHTML = '';
    state.names.forEach(n=>{
      const chip = document.createElement('div');
      chip.className = 'name-chip';
      chip.textContent = n;
      chip.onclick = ()=> selectName(n);
      listEl.appendChild(chip);
    });
  }

  function showRegisterBox(){
    el('nameListWrap').classList.add('hidden');
    el('registerBox').classList.remove('hidden');
  }

  el('showRegister').onclick = showRegisterBox;
  el('showList').onclick = ()=>{
    el('registerBox').classList.add('hidden');
    el('nameListWrap').classList.remove('hidden');
  };

  el('registerBtn').onclick = async ()=>{
    const name = el('regName').value.trim();
    if (!name){ el('gateMsg').textContent = '이름을 입력해주세요.'; return; }
    el('gateMsg').textContent = '등록 중';
    state = await api('register', {name});
    el('gateMsg').textContent = '';
    selectName(name);
  };

  function selectName(name){
    currentName = name;
    localStorage.setItem('exch_name', name);
    el('gate').classList.add('hidden');
    renderMain();
    renderBoard();
  }

  el('switchUser').onclick = ()=>{
    currentName = null;
    localStorage.removeItem('exch_name');
    el('main').classList.add('hidden');
    el('board').classList.add('hidden');
    el('gate').classList.remove('hidden');
    el('gateLoading').classList.add('hidden');
    renderGate();
  };

  function streakText(status){
    if (status === 'complete') return '이번 달 개근';
    if (status === 'onTrack') return '개근 진행중';
    return '';
  }

  function renderMain(){
    if (!currentName) return;
    el('main').classList.remove('hidden');
    el('helloName').textContent = currentName;
    el('todayDate').textContent = fmtDateKo(state.today);

    const status = (state.perfectStatus || {})[currentName];
    el('streakLabel').textContent = streakText(status);

    const myEntries = state.entries[currentName] || [];
    const doneToday = myEntries.includes(state.today);
    const btn = el('checkBtn');

    btn.disabled = false;
    btn.classList.toggle('primary', doneToday);
    btn.textContent = doneToday ? '체크됨' : '체크';
    el('checkMsg').textContent = doneToday ? '다시 누르면 취소돼요.' : '';

    btn.onclick = async ()=>{
      btn.disabled = true;
      const action = doneToday ? 'uncheck' : 'check';
      state = await api(action, {name: currentName, date: state.today});
      renderMain();
      renderBoard();
    };
  }

  function renderBoard(){
    if (!state.names.length) { el('board').classList.add('hidden'); return; }
    el('board').classList.remove('hidden');
    el('boardTitle').textContent = `${state.month} 현황`;

    const table = el('boardTable');
    let thead = '<tr><th class="name-cell">이름</th>';
    state.days.forEach(d=>{
      const classes = [];
      if (d.isWeekend) classes.push('weekend');
      if (d.date === state.today) classes.push('today');
      thead += `<th class="${classes.join(' ')}">${d.day}</th>`;
    });
    thead += '<th></th></tr>';

    let rows = '';
    state.names.forEach(n=>{
      const entries = state.entries[n] || [];
      const status = (state.perfectStatus || {})[n];
      const icon = status === 'complete' ? '개근' : (status === 'onTrack' ? '진행' : '');
      let row = `<tr><td class="name-cell">${n}${icon ? '<span class="badge-icon">'+icon+'</span>' : ''}</td>`;
      state.days.forEach(d=>{
        const marked = entries.includes(d.date);
        const cls = (d.date === state.today) ? 'today-col' : '';
        let dotCls = 'dot-empty';
        if (marked) dotCls = d.isWeekend ? 'dot-weekend' : 'dot-weekday';
        row += `<td class="${cls}"><span class="dot ${dotCls}"></span></td>`;
      });
      row += `<td class="count-cell">${entries.length}</td></tr>`;
      rows += row;
    });

    table.innerHTML = thead + rows;
  }

  (async function init(){
    await loadAll();
    if (currentName && state.names.includes(currentName)){
      el('gate').classList.add('hidden');
      renderMain();
      renderBoard();
    } else {
      currentName = null;
      renderGate();
      renderBoard();
    }
  })();
})();
</script>
</body>
</html>
